plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.tintuc'
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.0'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'site'
    productFlavors {
        vnexpress {
            dimension 'site'
            applicationId 'vn.tintuc.vnexpress'
            resValue 'string', 'app_name', 'VnExpress'
            buildConfigField 'String', 'URL', '"https://vnexpress.net"'
        }
        tuoitre {
            dimension 'site'
            applicationId 'vn.tintuc.tuoitre'
            resValue 'string', 'app_name', 'Tuổi Trẻ'
            buildConfigField 'String', 'URL', '"https://tuoitre.vn"'
        }
        dantri {
            dimension 'site'
            applicationId 'vn.tintuc.dantri'
            resValue 'string', 'app_name', 'Dân Trí'
            buildConfigField 'String', 'URL', '"https://dantri.com.vn"'
        }
        thanhnien {
            dimension 'site'
            applicationId 'vn.tintuc.thanhnien'
            resValue 'string', 'app_name', 'Thanh Niên'
            buildConfigField 'String', 'URL', '"https://thanhnien.vn"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
